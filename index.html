<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Alerte Navire 1km – Shelly</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: system-ui, Segoe UI, Arial, sans-serif; margin: 0; padding: 16px; background: #f6f7fb; color: #20223a; }
    .box { background: #fff; border: 1px solid #e8ebf6; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    h1 { font-size: 20px; margin: 4px 0 12px; }
    label { display: block; font-size: 13px; margin: 8px 0 4px; }
    input { width: 100%; padding: 10px; border: 1px solid #cfd5e6; border-radius: 8px; font-size: 14px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 180px; }
    button { cursor: pointer; padding: 10px 14px; border: 0; border-radius: 8px; background: #5569ff; color: #fff; font-weight: 600; }
    button.secondary { background: #e8eaff; color: #29306d; }
    .status { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; white-space: pre-wrap; background: #f2f4fb; color: #1d1f3f; border-radius: 8px; padding: 10px; overflow: auto; max-height: 180px; }
    .pill { display: inline-block; padding: 4px 8px; border-radius: 999px; background: #eef2ff; color: #272968; font-size: 12px; margin-left: 6px; }
    .alert { background: #ffe9ea; color: #9a0414; border-color: #ffc7cc; }
    .ok { background: #e9fff1; color: #0b6b34; border-color: #b8f0cb; }
    #map { height: 210px; border-radius: 8px; border: 1px solid #cfd5e6; }
    .cron-state { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .cron-state .pill.warn { background: #fff3cd; color: #7a5b00; }
    .cron-state .pill.bad  { background: #ffe9ea; color: #9a0414; }
    .cron-state .pill.good { background: #e9fff1; color: #0b6b34; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Alerte 1 km <span class="pill">alerte.bakabi.fr</span></h1>
    <div class="row">
      <div>
        <label>Token EuRIS (Bearer)</label>
        <input id="eurisToken" type="text" placeholder="Collez le token ici" />
      </div>
      <div>
        <label>Rayon alerte (m)</label>
        <input id="rayon" type="number" value="1000" />
      </div>
      <div>
        <label>Période scan (s)</label>
        <input id="periode" type="number" value="20" />
      </div>
    </div>
    <div class="row">
      <div>
        <label>Latitude base</label>
        <input id="latBase" type="number" step="0.000001" value="48.853229" />
      </div>
      <div>
        <label>Longitude base</label>
        <input id="lonBase" type="number" step="0.000001" value="2.225328" />
      </div>
      <div>
        <label>Page size API</label>
        <input id="pageSize" type="number" value="100" />
      </div>
    </div>
  </div>

  <div class="box">
    <h1>Surveillance autonome (serveur)</h1>
    <div class="cron-state">
      <div id="cronAge" class="pill">Cron: en attente…</div>
      <div id="cronAlerte" class="pill">Alerte serveur: ?</div>
      <div id="cronCompteur" class="pill">Vu serveur: ?</div>
      <div id="cronProche" class="pill">+ proche: ?</div>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="btnCronOn">Activer surveillance auto</button>
      <button id="btnCronOff" class="secondary">Désactiver surveillance auto</button>
      <button id="btnZoneSync">Appliquer la zone au serveur</button>
    </div>
  </div>

  <div class="box">
    <h1>Prise Shelly (Cloud)</h1>
    <div class="row" style="margin-top:10px">
      <button id="btnTest">Tester la prise (allumer 10s)</button>
      <button id="btnOn">Allumer</button>
      <button id="btnOff" class="secondary">Éteindre</button>
    </div>
  </div>

  <div class="box" id="boxEtat">
    <h1>État</h1>
    <div class="row">
      <div><div id="etatAlerte" class="pill">Alerte: inactif</div></div>
      <div><div id="naviresCompteur" class="pill">Navires proches: 0</div></div>
      <div><div id="derniereMaj" class="pill">Dernière MAJ: jamais</div></div>
    </div>
    <div class="status" id="log"></div>
  </div>

  <div class="box">
    <div class="row">
      <button id="btnStart">Démarrer la surveillance</button>
      <button id="btnStop" class="secondary">Arrêter</button>
    </div>
  </div>

  <div class="box">
    <h1>Carte live</h1>
    <div id="map"></div>
  </div>

  <script>
    // ================= UTILITAIRES =================
    const logEl = document.getElementById('log');
    function log(msg) {
      const t = new Date().toLocaleTimeString();
      logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
    }

    // Distance Haversine (m)
    function distanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    // BBox en degrés autour du point (approximation)
    function makeBBox(lat, lon, rayonM) {
      const dLat = (rayonM / 111320);
      const dLon = (rayonM / (111320 * Math.cos(lat * Math.PI/180)));
      return {
        minLat: lat - dLat, maxLat: lat + dLat,
        minLon: lon - dLon, maxLon: lon + dLon
      };
    }

    // ================= RÉFÉRENCES UI =================
    const el = {
      token: document.getElementById('eurisToken'),
      rayon: document.getElementById('rayon'),
      periode: document.getElementById('periode'),
      lat: document.getElementById('latBase'),
      lon: document.getElementById('lonBase'),
      pageSize: document.getElementById('pageSize'),
      btnTest: document.getElementById('btnTest'),
      btnOn: document.getElementById('btnOn'),
      btnOff: document.getElementById('btnOff'),
      btnStart: document.getElementById('btnStart'),
      btnStop: document.getElementById('btnStop'),
      etatAlerte: document.getElementById('etatAlerte'),
      naviresCompteur: document.getElementById('naviresCompteur'),
      derniereMaj: document.getElementById('derniereMaj'),
      boxEtat: document.getElementById('boxEtat'),
      cronAge: document.getElementById('cronAge'),
      cronAlerte: document.getElementById('cronAlerte'),
      cronCompteur: document.getElementById('cronCompteur'),
      cronProche: document.getElementById('cronProche'),
      btnCronOn: document.getElementById('btnCronOn'),
      btnCronOff: document.getElementById('btnCronOff'),
      btnZoneSync: document.getElementById('btnZoneSync'),
    };

    let timer = null;
    let cronTimer = null;
    let alerteActive = false;

    // ================= CARTE LEAFLET =================
    let map = null;
    let baseMarker = null;
    let baseCircle = null;
    let shipLayer = null;

    function initMap() {
      const lat = Number(el.lat.value) || 48.853229;
      const lon = Number(el.lon.value) || 2.225328;
      const rayon = Number(el.rayon.value) || 1000;
      map = L.map('map').setView([lat, lon], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);
      baseCircle = L.circle([lat, lon], {
        color: '#ff4a4a', weight: 2, fillColor: '#ff4a4a', fillOpacity: 0.08, radius: rayon
      }).addTo(map);
      baseMarker = L.circleMarker([lat, lon], {
        color: '#5569ff', fillColor: '#5569ff', fillOpacity: 1, radius: 7
      }).addTo(map).bindPopup('Base alerte');
      shipLayer = L.layerGroup().addTo(map);
    }

    function fmtShipPopup(s) {
      const name = s.name || s.shipName || (s.mmsi ? 'MMSI ' + s.mmsi : '???');
      const sog  = s.speed ?? s.SOG;
      const cog  = s.course ?? s.COG;
      const sogTxt = (sog !== null && sog !== undefined) ? `<br>${Number(sog).toFixed(1)} kn` : '';
      const cogTxt = (cog !== null && cog !== undefined) ? `, cap ${Math.round(Number(cog))}°` : '';
      return `<b>${name}</b><br>${s.distance} m${sogTxt}${cogTxt}`;
    }

    function refreshMap(ships, baseLat, baseLon, rayon) {
      if (!map) return;
      baseCircle.setLatLng([baseLat, baseLon]); baseCircle.setRadius(rayon);
      baseMarker.setLatLng([baseLat, baseLon]);
      shipLayer.clearLayers();
      for (const s of ships) {
        const slat = s.lat ?? s.latitude;
        const slon = s.lon ?? s.longitude;
        if (!isFinite(slat) || !isFinite(slon)) continue;
        const inRange = s.distance <= rayon;
        const color = inRange ? '#ff4a4a' : '#3b82f6';
        L.circleMarker([slat, slon], {
          color, fillColor: color, fillOpacity: 0.85,
          radius: inRange ? 7 : 5, weight: inRange ? 2 : 1
        }).addTo(shipLayer).bindPopup(fmtShipPopup(s));
      }
    }

    // ================= BACKEND SHELLY (Coolify) =================
    // Envoie action/durée à /api/shelly.php, qui relaie vers le Shelly Cloud officiel.
    async function shellyApi(action, dureeSec) {
      const payload = dureeSec ? { action, duree: Number(dureeSec) } : { action };
      const tag = `Shelly ${action.toUpperCase()}${dureeSec ? `(${dureeSec}s)` : ''}`;
      const t0 = performance.now();
      try {
        const res = await fetch('/api/shelly.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const ms = Math.round(performance.now() - t0);
        const ct = res.headers.get('content-type') || '';
        if (!ct.includes('application/json')) {
          const txt = (await res.text()).slice(0, 120).replace(/\s+/g, ' ');
          throw new Error(`HTTP ${res.status} (${ms}ms) réponse non-JSON: ${txt}`);
        }
        const data = await res.json();
        if (!res.ok || data.ok === false) {
          const det = data.detail ? ` | ${JSON.stringify(data.detail).slice(0, 120)}` : '';
          throw new Error(`HTTP ${res.status} (${ms}ms) ${data.error || 'erreur'}${det}`);
        }
        log(`${tag} OK (${ms}ms) — ${data.message || (action === 'on' ? 'allumée' : 'éteinte')}`);
      } catch (e) {
        log(`${tag} ÉCHEC — ${e.message}`);
      }
    }

    // ================= APPEL EURIS VIA PROXY PHP =================
    async function fetchNavires() {
      const token = el.token.value.trim();
      if (!token) {
        log('⚠️ Token EuRIS requis');
        return { tracks: [], ms: 0 };
      }
      const lat = Number(el.lat.value);
      const lon = Number(el.lon.value);
      const rayon = Number(el.rayon.value);
      const pageSize = Number(el.pageSize.value);

      const bbox = makeBBox(lat, lon, Math.max(2000, rayon)); // BBox > rayon pour être sûr de capturer
      const url = `./euris-proxy.php?minLat=${bbox.minLat.toFixed(6)}&maxLat=${bbox.maxLat.toFixed(6)}&minLon=${bbox.minLon.toFixed(6)}&maxLon=${bbox.maxLon.toFixed(6)}&pageSize=${pageSize}`;

      const t0 = performance.now();
      try {
        const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
        const ms = Math.round(performance.now() - t0);
        const data = await res.json();
        if (!res.ok) {
          log(`EuRIS ÉCHEC HTTP ${res.status} (${ms}ms) — ${data?.message || data?.error || 'inconnu'}`);
          return { tracks: [], ms };
        }
        return { ...data, ms };
      } catch (e) {
        const ms = Math.round(performance.now() - t0);
        log(`EuRIS réseau ÉCHEC (${ms}ms) — ${e.message}`);
        return { tracks: [], ms };
      }
    }

    // ================= BOUCLE DE SURVEILLANCE =================
    function fmtNavire(t) {
      const nom = t.shipName || t.vesselName || t.ShipName || (t.mmsi ? `MMSI ${t.mmsi}` : '???');
      const sog = t.speed ?? t.SOG;
      const sogTxt = (sog !== null && sog !== undefined) ? ` ${Number(sog).toFixed(1)}kn` : '';
      return `${nom} (${t.distance}m${sogTxt})`;
    }

    async function tick() {
      const lat = Number(el.lat.value);
      const lon = Number(el.lon.value);
      const rayon = Number(el.rayon.value);

      const { tracks = [], ms = 0 } = await fetchNavires();

      // Enrichir tous les navires (pour la carte) + filtrer ceux dans le rayon
      const allShips = [];
      const proches = [];
      let plusProche = null;
      for (const t of tracks) {
        const nlat = Number(t.latitude ?? t.lat ?? t.Latitude ?? 0);
        const nlon = Number(t.longitude ?? t.lon ?? t.Longitude ?? 0);
        if (!isFinite(nlat) || !isFinite(nlon)) continue;
        const d = distanceMeters(lat, lon, nlat, nlon);
        const enrichi = { ...t, lat: nlat, lon: nlon, distance: Math.round(d) };
        allShips.push(enrichi);
        if (!plusProche || d < plusProche.distance) plusProche = enrichi;
        if (d <= rayon) proches.push(enrichi);
      }
      proches.sort((a, b) => a.distance - b.distance);

      refreshMap(allShips, lat, lon, rayon);

      el.naviresCompteur.textContent = `Navires proches: ${proches.length}`;
      el.derniereMaj.textContent = 'Dernière MAJ: ' + new Date().toLocaleTimeString();

      const proche = plusProche ? ` | + proche: ${fmtNavire(plusProche)}` : '';
      log(`scan EuRIS ${ms}ms — ${tracks.length} reçus, ${proches.length} ≤ ${rayon}m${proche}`);

      // NB: Shelly est piloté côté serveur par cron/tick.php toutes les 30s.
      // La page n'allume/éteint plus automatiquement pour éviter les doublons.
      // Les boutons Allumer/Éteindre/Test 10s restent dispo pour le contrôle manuel.
      const enAlerte = proches.length > 0;
      if (enAlerte && !alerteActive) {
        alerteActive = true;
        el.etatAlerte.textContent = 'Alerte (vue page): ACTIVE';
        el.boxEtat.className = 'box alert';
        const liste = proches.slice(0, 3).map(fmtNavire).join(', ');
        const reste = proches.length > 3 ? ` +${proches.length - 3}` : '';
        log(`ALERTE (page) — ${proches.length} navire(s) ≤ ${rayon}m: ${liste}${reste}`);
      } else if (!enAlerte && alerteActive) {
        alerteActive = false;
        el.etatAlerte.textContent = 'Alerte (vue page): inactif';
        el.boxEtat.className = 'box ok';
        log('FIN ALERTE (page) — zone vide');
      }
    }

    // ================= PILOTAGE CRON (start/stop/zone) =================
    async function getConfig() {
      try {
        const res = await fetch('/api/config.php', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      } catch (e) {
        log('Config GET erreur: ' + e.message);
        return null;
      }
    }

    async function postConfig(patch, label) {
      try {
        const res = await fetch('/api/config.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patch),
        });
        const data = await res.json();
        if (!res.ok || data.ok === false) throw new Error(data.error || 'HTTP ' + res.status);
        log(`${label} OK — ${JSON.stringify(data.config)}`);
        pollCronState();
        return data.config;
      } catch (e) {
        log(`${label} ÉCHEC — ${e.message}`);
        return null;
      }
    }

    // ================= POLLING ÉTAT DU CRON SERVEUR =================
    async function pollCronState() {
      try {
        const res = await fetch('/api/state.php', { cache: 'no-store' });
        if (!res.ok) {
          el.cronAge.textContent = `Cron: HTTP ${res.status}`;
          el.cronAge.className = 'pill bad';
          return;
        }
        const s = await res.json();
        if (!s.ok) {
          el.cronAge.textContent = `Cron: ${s.error || 'KO'}`;
          el.cronAge.className = 'pill bad';
          return;
        }
        const age = s._age_seconds;
        if (s.disabled) {
          el.cronAge.textContent = `Cron: DÉSACTIVÉ (depuis ${age}s)`;
          el.cronAge.className = 'pill warn';
          el.cronAlerte.textContent = 'Alerte serveur: pause';
          el.cronAlerte.className = 'pill warn';
          el.cronCompteur.textContent = 'Vu serveur: —';
          el.cronProche.textContent = '+ proche: —';
          return;
        }
        el.cronAge.textContent = `Cron: tick il y a ${age}s`;
        el.cronAge.className = 'pill ' + (s._stale ? 'bad' : (age > 40 ? 'warn' : 'good'));
        el.cronAlerte.textContent = `Alerte serveur: ${s.alert_active ? 'ACTIVE' : 'inactif'}`;
        el.cronAlerte.className = 'pill ' + (s.alert_active ? 'bad' : 'good');
        el.cronCompteur.textContent = `Vu serveur: ${s.ships_in_range}/${s.ships_total}`;
        if (s.closest_ship) {
          const c = s.closest_ship;
          const nm = c.name || (c.mmsi ? 'MMSI ' + c.mmsi : '???');
          el.cronProche.textContent = `+ proche: ${nm} @ ${c.distance}m`;
        } else {
          el.cronProche.textContent = '+ proche: aucun';
        }
        if (!timer && Array.isArray(s.ships)) {
          refreshMap(s.ships, s.base.lat, s.base.lon, s.radius_m);
        }
      } catch (e) {
        el.cronAge.textContent = `Cron: erreur ${e.message}`;
        el.cronAge.className = 'pill bad';
      }
    }

    // ================= CONTRÔLES UI =================
    el.btnStart.addEventListener('click', () => {
      if (timer) return;
      log('Surveillance démarrée');
      el.boxEtat.className = 'box ok';
      tick();
      timer = setInterval(tick, Math.max(5, Number(el.periode.value)) * 1000);
    });

    el.btnStop.addEventListener('click', () => {
      if (timer) {
        clearInterval(timer);
        timer = null;
        log('Surveillance arrêtée');
      }
    });

    el.btnTest.addEventListener('click', () => shellyApi('on', 10));
    el.btnOn.addEventListener('click', () => shellyApi('on'));
    el.btnOff.addEventListener('click', () => shellyApi('off'));

    el.btnCronOn.addEventListener('click', () => postConfig({ enabled: true }, 'Cron ACTIVER'));
    el.btnCronOff.addEventListener('click', () => postConfig({ enabled: false }, 'Cron DÉSACTIVER'));
    el.btnZoneSync.addEventListener('click', () => {
      const lat = Number(el.lat.value);
      const lon = Number(el.lon.value);
      const radius_m = Number(el.rayon.value);
      if (!isFinite(lat) || !isFinite(lon) || !isFinite(radius_m)) {
        log('Zone invalide — vérifier lat/lon/rayon'); return;
      }
      postConfig({ lat, lon, radius_m }, 'Zone serveur ENVOYÉE');
    });

    // ================= INITIALISATION =================
    initMap();
    // Récupérer la config serveur et synchroniser les champs UI avec ce que le cron utilise
    getConfig().then(cfg => {
      if (!cfg) return;
      if (isFinite(cfg.lat))      el.lat.value   = cfg.lat;
      if (isFinite(cfg.lon))      el.lon.value   = cfg.lon;
      if (isFinite(cfg.radius_m)) el.rayon.value = cfg.radius_m;
      log(`Config serveur: ${cfg.enabled ? 'actif' : 'désactivé'} | zone ${cfg.lat},${cfg.lon} r=${cfg.radius_m}m`);
      // Re-centrer la carte sur la zone du cron
      if (map && baseCircle && baseMarker) {
        baseCircle.setLatLng([cfg.lat, cfg.lon]); baseCircle.setRadius(cfg.radius_m);
        baseMarker.setLatLng([cfg.lat, cfg.lon]);
        map.setView([cfg.lat, cfg.lon], map.getZoom() || 14);
      }
    });
    pollCronState();
    cronTimer = setInterval(pollCronState, 15000);
  </script>
</body>
</html>

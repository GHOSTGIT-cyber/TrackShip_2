<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Alerte Navire – Commande</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: system-ui, Segoe UI, Arial, sans-serif; margin: 0; padding: 16px; background: #f6f7fb; color: #20223a; }
    .box { background: #fff; border: 1px solid #e8ebf6; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    h1 { font-size: 20px; margin: 4px 0 12px; }
    label { display: block; font-size: 13px; margin: 8px 0 4px; }
    input { width: 100%; padding: 10px; border: 1px solid #cfd5e6; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 150px; }
    button { cursor: pointer; padding: 10px 14px; border: 0; border-radius: 8px; background: #5569ff; color: #fff; font-weight: 600; }
    button.secondary { background: #e8eaff; color: #29306d; }
    button.danger { background: #e23b46; }
    .status { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; white-space: pre-wrap; background: #f2f4fb; color: #1d1f3f; border-radius: 8px; padding: 10px; overflow: auto; max-height: 180px; }
    .pill { display: inline-block; padding: 4px 8px; border-radius: 999px; background: #eef2ff; color: #272968; font-size: 12px; margin: 2px 6px 2px 0; }
    .pill.warn { background: #fff3cd; color: #7a5b00; }
    .pill.bad  { background: #ffe9ea; color: #9a0414; }
    .pill.good { background: #e9fff1; color: #0b6b34; }
    .alert { background: #ffe9ea; border-color: #ffc7cc; }
    .ok { background: #e9fff1; border-color: #b8f0cb; }
    #map { height: 210px; border-radius: 8px; border: 1px solid #cfd5e6; }
    .legende { font-size: 12px; color: #5a5e7a; margin-top: 6px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 3px -1px 8px; }
  </style>
</head>
<body>

  <div class="box">
    <h1>Alerte Navire <span class="pill">alerte.bakabi.fr</span></h1>
    <div class="row">
      <div>
        <label>Mot de passe commandes</label>
        <input id="pagePass" type="password" placeholder="Mot de passe" />
      </div>
      <div>
        <label>Latitude base</label>
        <input id="latBase" type="number" step="0.000001" value="48.853229" />
      </div>
      <div>
        <label>Longitude base</label>
        <input id="lonBase" type="number" step="0.000001" value="2.225328" />
      </div>
      <div>
        <label>Rayon alerte (m)</label>
        <input id="rayon" type="number" value="1000" />
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="btnZoneSync" class="secondary">Appliquer la zone au serveur</button>
    </div>
  </div>

  <div class="box" id="boxEtat">
    <h1>Surveillance serveur (autonome 24/7)</h1>
    <div>
      <span id="cronAge" class="pill">Serveur: connexion…</span>
      <span id="cronAlerte" class="pill">Alerte: ?</span>
      <span id="cronCompteur" class="pill">Navires: ?</span>
      <span id="cronProche" class="pill">+ proche: ?</span>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="btnCronOn">Activer la surveillance</button>
      <button id="btnCronOff" class="danger">Désactiver la surveillance</button>
    </div>
  </div>

  <div class="box">
    <h1>Prise Shelly</h1>
    <div>
      <span id="plugOnline" class="pill">Prise: ?</span>
      <span id="plugOutput" class="pill">Sortie: ?</span>
      <span id="plugPower" class="pill">Conso: ?</span>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="btnPlugCheck" class="secondary">Détecter la prise</button>
      <button id="btnTest">Tester (10s)</button>
      <button id="btnOn">Allumer</button>
      <button id="btnOff" class="secondary">Éteindre</button>
    </div>
  </div>

  <div class="box">
    <h1>Journal</h1>
    <div class="status" id="log"></div>
  </div>

  <div class="box">
    <h1>Carte live</h1>
    <div id="map"></div>
    <div class="legende">
      <span class="dot" style="background:#e23b46"></span>en mouvement dans la zone (déclenche)
      <span class="dot" style="background:#3b82f6"></span>en mouvement
      <span class="dot" style="background:#9aa0b4"></span>à l'arrêt (ignoré)
    </div>
  </div>

  <script>
    // ================= UTILITAIRES =================
    const logEl = document.getElementById('log');
    function log(msg) {
      const t = new Date().toLocaleTimeString();
      logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
    }

    const el = {
      pass: document.getElementById('pagePass'),
      lat: document.getElementById('latBase'),
      lon: document.getElementById('lonBase'),
      rayon: document.getElementById('rayon'),
      btnZoneSync: document.getElementById('btnZoneSync'),
      cronAge: document.getElementById('cronAge'),
      cronAlerte: document.getElementById('cronAlerte'),
      cronCompteur: document.getElementById('cronCompteur'),
      cronProche: document.getElementById('cronProche'),
      btnCronOn: document.getElementById('btnCronOn'),
      btnCronOff: document.getElementById('btnCronOff'),
      plugOnline: document.getElementById('plugOnline'),
      plugOutput: document.getElementById('plugOutput'),
      plugPower: document.getElementById('plugPower'),
      btnPlugCheck: document.getElementById('btnPlugCheck'),
      btnTest: document.getElementById('btnTest'),
      btnOn: document.getElementById('btnOn'),
      btnOff: document.getElementById('btnOff'),
      boxEtat: document.getElementById('boxEtat'),
    };

    // Mot de passe : mémorisé dans le navigateur (sessionStorage)
    el.pass.value = sessionStorage.getItem('page_pass') || '';
    el.pass.addEventListener('change', () => sessionStorage.setItem('page_pass', el.pass.value));
    function authHeaders() {
      return { 'Content-Type': 'application/json', 'X-Page-Auth': el.pass.value };
    }

    // ================= CARTE LEAFLET =================
    let map = null, baseMarker = null, baseCircle = null, shipLayer = null;

    function initMap() {
      const lat = Number(el.lat.value), lon = Number(el.lon.value), rayon = Number(el.rayon.value);
      map = L.map('map').setView([lat, lon], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap'
      }).addTo(map);
      baseCircle = L.circle([lat, lon], { color: '#e23b46', weight: 2, fillColor: '#e23b46', fillOpacity: 0.08, radius: rayon }).addTo(map);
      baseMarker = L.circleMarker([lat, lon], { color: '#5569ff', fillColor: '#5569ff', fillOpacity: 1, radius: 7 }).addTo(map).bindPopup('Base alerte');
      shipLayer = L.layerGroup().addTo(map);
    }

    function shipPopup(s) {
      const name = s.name || (s.mmsi ? 'MMSI ' + s.mmsi : '???');
      const sog = (s.speed !== null && s.speed !== undefined) ? `<br>${Number(s.speed).toFixed(1)} kn` : '';
      const cog = (s.course !== null && s.course !== undefined) ? `, cap ${Math.round(Number(s.course))}°` : '';
      const etat = s.moving ? 'en mouvement' : "à l'arrêt (ignoré)";
      return `<b>${name}</b><br>${s.distance} m — ${etat}${sog}${cog}`;
    }

    function refreshMap(ships, baseLat, baseLon, rayon) {
      if (!map) return;
      baseCircle.setLatLng([baseLat, baseLon]); baseCircle.setRadius(rayon);
      baseMarker.setLatLng([baseLat, baseLon]);
      shipLayer.clearLayers();
      for (const s of ships) {
        if (!isFinite(s.lat) || !isFinite(s.lon)) continue;
        const inRange = s.moving && s.distance <= rayon;
        const color = inRange ? '#e23b46' : (s.moving ? '#3b82f6' : '#9aa0b4');
        L.circleMarker([s.lat, s.lon], {
          color, fillColor: color, fillOpacity: 0.85,
          radius: inRange ? 7 : 5, weight: inRange ? 2 : 1
        }).addTo(shipLayer).bindPopup(shipPopup(s));
      }
    }

    // ================= API GÉNÉRIQUE =================
    async function postJson(url, payload, label) {
      try {
        const res = await fetch(url, { method: 'POST', headers: authHeaders(), body: JSON.stringify(payload) });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) throw new Error('mot de passe invalide (champ en haut de page)');
        if (!res.ok || data.ok === false) throw new Error(data.error || ('HTTP ' + res.status));
        log(`${label} OK${data.message ? ' — ' + data.message : ''}`);
        return data;
      } catch (e) {
        log(`${label} ÉCHEC — ${e.message}`);
        return null;
      }
    }

    // ================= PRISE SHELLY =================
    function shellyApi(action, dureeSec) {
      const payload = dureeSec ? { action, duree: Number(dureeSec) } : { action };
      const tag = `Prise ${action.toUpperCase()}${dureeSec ? `(${dureeSec}s)` : ''}`;
      return postJson('/api/shelly.php', payload, tag).then(r => { if (r) setTimeout(pollPlug, 2500); });
    }

    async function pollPlug() {
      try {
        const res = await fetch('/api/shelly-status.php', { cache: 'no-store' });
        const s = await res.json();
        if (!s.ok) throw new Error(s.error || 'HTTP ' + res.status);
        el.plugOnline.textContent = s.online ? 'Prise: EN LIGNE' : 'Prise: HORS LIGNE';
        el.plugOnline.className = 'pill ' + (s.online ? 'good' : 'bad');
        el.plugOutput.textContent = 'Sortie: ' + (s.output === null ? '?' : (s.output ? 'ALLUMÉE' : 'éteinte'));
        el.plugOutput.className = 'pill ' + (s.output ? 'warn' : '');
        el.plugPower.textContent = 'Conso: ' + (s.power_w === null ? '?' : s.power_w.toFixed(1) + ' W');
        return s;
      } catch (e) {
        el.plugOnline.textContent = 'Prise: erreur';
        el.plugOnline.className = 'pill bad';
        el.plugOutput.textContent = 'Sortie: ?';
        el.plugPower.textContent = 'Conso: ?';
        return null;
      }
    }

    // ================= CONFIG SERVEUR (zone + on/off) =================
    async function getConfig() {
      try {
        const res = await fetch('/api/config.php', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      } catch (e) {
        log('Lecture config serveur impossible: ' + e.message);
        return null;
      }
    }

    // ================= ÉTAT SERVEUR (poll 10s) =================
    let lastAlert = null;
    async function pollState() {
      try {
        const res = await fetch('/api/state.php', { cache: 'no-store' });
        const s = await res.json();
        if (!s.ok) {
          el.cronAge.textContent = `Serveur: ${s.error || 'pas de données'}`;
          el.cronAge.className = 'pill warn';
          return;
        }
        const age = s._age_seconds;
        if (s.disabled) {
          el.cronAge.textContent = `Serveur: surveillance DÉSACTIVÉE`;
          el.cronAge.className = 'pill warn';
          el.cronAlerte.textContent = 'Alerte: pause';
          el.cronAlerte.className = 'pill warn';
          el.boxEtat.className = 'box';
          return;
        }
        el.cronAge.textContent = `Serveur: tick il y a ${age}s`;
        el.cronAge.className = 'pill ' + (s._stale ? 'bad' : (age > 45 ? 'warn' : 'good'));
        el.cronAlerte.textContent = `Alerte: ${s.alert_active ? 'ACTIVE' : 'inactif'}`;
        el.cronAlerte.className = 'pill ' + (s.alert_active ? 'bad' : 'good');
        el.boxEtat.className = 'box ' + (s.alert_active ? 'alert' : 'ok');
        el.cronCompteur.textContent = `Navires: ${s.ships_total ?? '?'} (${s.ships_moving ?? '?'} en mouv.) — ${s.ships_in_range ?? '?'} déclencheur(s)`;
        if (s.closest_ship) {
          const c = s.closest_ship;
          el.cronProche.textContent = `+ proche: ${c.name || ('MMSI ' + (c.mmsi || '?'))} @ ${c.distance}m`;
        } else {
          el.cronProche.textContent = '+ proche: aucun en mouvement';
        }
        if (lastAlert !== null && s.alert_active !== lastAlert) {
          log(s.alert_active
            ? `🔴 ALERTE SERVEUR — ${s.ships_in_range} navire(s) en mouvement dans la zone → prise allumée`
            : '🟢 FIN ALERTE — zone libre → prise éteinte');
          setTimeout(pollPlug, 2500);
        }
        lastAlert = s.alert_active;
        if (Array.isArray(s.ships) && s.base) {
          refreshMap(s.ships, s.base.lat, s.base.lon, s.radius_m);
        }
      } catch (e) {
        el.cronAge.textContent = 'Serveur: injoignable';
        el.cronAge.className = 'pill bad';
      }
    }

    // ================= BOUTONS =================
    el.btnZoneSync.addEventListener('click', () => {
      const lat = Number(el.lat.value), lon = Number(el.lon.value), radius_m = Number(el.rayon.value);
      if (!isFinite(lat) || !isFinite(lon) || !isFinite(radius_m)) { log('Zone invalide'); return; }
      postJson('/api/config.php', { lat, lon, radius_m }, 'Zone serveur').then(r => {
        if (r && map) {
          baseCircle.setLatLng([lat, lon]); baseCircle.setRadius(radius_m);
          baseMarker.setLatLng([lat, lon]);
          map.setView([lat, lon], map.getZoom());
        }
      });
    });
    el.btnCronOn.addEventListener('click', () => postJson('/api/config.php', { enabled: true }, 'Surveillance ACTIVER').then(() => setTimeout(pollState, 1500)));
    el.btnCronOff.addEventListener('click', () => postJson('/api/config.php', { enabled: false }, 'Surveillance DÉSACTIVER').then(() => setTimeout(pollState, 1500)));
    el.btnPlugCheck.addEventListener('click', async () => {
      log('Détection de la prise…');
      const s = await pollPlug();
      if (s) log(`Prise ${s.online ? 'EN LIGNE' : 'HORS LIGNE'} — sortie ${s.output ? 'ON' : 'OFF'} — ${s.power_w !== null ? s.power_w.toFixed(1) + ' W' : 'conso inconnue'} (${s.ms}ms)`);
      else log('Détection ÉCHEC — voir pills ci-dessus');
    });
    el.btnTest.addEventListener('click', () => shellyApi('on', 10));
    el.btnOn.addEventListener('click', () => shellyApi('on'));
    el.btnOff.addEventListener('click', () => shellyApi('off'));

    // ================= INITIALISATION =================
    initMap();
    getConfig().then(cfg => {
      if (!cfg) return;
      if (isFinite(cfg.lat)) el.lat.value = cfg.lat;
      if (isFinite(cfg.lon)) el.lon.value = cfg.lon;
      if (isFinite(cfg.radius_m)) el.rayon.value = cfg.radius_m;
      log(`Config serveur chargée — surveillance ${cfg.enabled ? 'ACTIVE' : 'désactivée'}, zone ${cfg.lat}, ${cfg.lon}, rayon ${cfg.radius_m}m`);
      if (map) {
        baseCircle.setLatLng([cfg.lat, cfg.lon]); baseCircle.setRadius(cfg.radius_m);
        baseMarker.setLatLng([cfg.lat, cfg.lon]);
        map.setView([cfg.lat, cfg.lon], 14);
      }
    });
    pollState();
    pollPlug();
    setInterval(pollState, 10000);
    setInterval(pollPlug, 30000);
  </script>
</body>
</html>
